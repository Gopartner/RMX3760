name: Build TWRP RMX3760 Android 15 (init_boot)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            repo \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            lib32ncurses6 \
            libncurses5-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3 \
            python-is-python3 \
            rsync \
            cpio \
            lz4 \
            bc

      - name: Prepare repo
        run: |
          mkdir -p ~/bin
          ln -sf /usr/bin/repo ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init TWRP Source
        run: |
          mkdir workspace
          cd workspace

          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      - name: Build TWRP (Target: init_boot)
        run: |
          cd workspace

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_RMX3760-eng

          # Target utama untuk Android 13 - 15 (Boot Header v4)
          mka init_bootimage -j$(nproc) || mka recoveryimage -j$(nproc)

      - name: Collect Output Artifacts
        run: |
          mkdir -p workspace/output

          # Salin file init_boot.img dan recovery/ramdisk jika ada
          cp workspace/out/target/product/RMX3760/init_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/ramdisk-recovery.cpio workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true

      - name: Upload TWRP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760_Android15
          path: workspace/output/*
