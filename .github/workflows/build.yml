name: Build TWRP RMX3760 Android 15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core repo gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32z1-dev lib32ncurses6 libncurses5-dev \
            libxml2-utils xsltproc unzip python3 python-is-python3 rsync cpio lz4 bc

      - name: Prepare repo
        run: |
          mkdir -p ~/bin
          ln -sf /usr/bin/repo ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 1. Checkout Device Tree dulu ke folder sementara (Aman dari wipe)
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree_temp

      # 2. Init & Sync TWRP Manifest Source
      - name: Init TWRP Source
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

      # 3. Pindahkan Device Tree ke lokasi AOSP setelah repo sync tuntas
      - name: Setup Device Tree Location
        run: |
          mkdir -p workspace/device/realme/RMX3760
          cp -r device_tree_temp/* workspace/device/realme/RMX3760/
          rm -rf device_tree_temp

      # 4. Process Build murni untuk target init_boot
      - name: Build TWRP
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          
          lunch twrp_RMX3760-eng

          # Kompilasi murni target init_bootimage
          mka bootimage -j$(nproc)

      - name: Collect & Verify Artifacts
        run: |
          mkdir -p workspace/output
          
          if [ -f workspace/out/target/product/RMX3760/init_boot.img ]; then
            cp workspace/out/target/product/RMX3760/init_boot.img workspace/output/twrp_init_boot.img
            echo "SUCCESS: init_boot.img berhasil dibuat!"
          else
            echo "ERROR: init_boot.img TIDAK DITEMUKAN!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760_Android15
          path: workspace/output/twrp_init_boot.img
