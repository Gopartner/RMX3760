name: Build TWRP RMX3760 Android 15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            repo \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            lib32ncurses6 \
            libncurses5-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3 \
            python-is-python3 \
            rsync \
            cpio \
            lz4 \
            bc

      - name: Prepare Repo
        run: |
          mkdir -p ~/bin
          ln -sf /usr/bin/repo ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree_temp

      - name: Init TWRP Source
        run: |
          mkdir workspace
          cd workspace

          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --optimized-fetch \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Copy Device Tree
        run: |
          mkdir -p workspace/device/realme/RMX3760
          cp -a device_tree_temp/. workspace/device/realme/RMX3760/
          rm -rf device_tree_temp

      - name: Verify Device Tree
        run: |
          ls -R workspace/device/realme/RMX3760

      - name: Build Vendor Boot
        run: |
          cd workspace

          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_MISSING_BUILD_REQUIREMENTS=true
          export LC_ALL=C

          source build/envsetup.sh

          echo "===== PRODUCTS ====="
          list_products

          echo "===== RELEASES ====="
          list_releases

          lunch twrp_RMX3760-eng

          mka vendorbootimage -j$(nproc)

      - name: Verify Output
        run: |
          cd workspace

          echo "========== OUTPUT =========="
          find out/target/product -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
            \)

      - name: Collect Artifact
        run: |
          mkdir -p workspace/output

          find workspace/out/target/product \
            -name "vendor_boot.img" \
            -exec cp {} workspace/output/twrp_vendor_boot.img \;

          if [ ! -f workspace/output/twrp_vendor_boot.img ]; then
            echo "vendor_boot.img not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp_vendor_boot
          path: workspace/output/twrp_vendor_boot.img
