name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            libncurses6 \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Repo
        run: |
          mkdir workspace
          cd workspace

          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

               - name: Find Boot HAL Source
        run: |
          cd workspace

          echo "===== IBootControl ====="
          grep -R -n "IBootControl" bootable/recovery || true

          echo
          echo "===== getService ====="
          grep -R -n "getService" bootable/recovery || true

          echo
          echo "===== android.hardware.boot ====="
          grep -R -n "android.hardware.boot" bootable/recovery || true

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      - name: Build Recovery
        run: |
          cd workspace

          export ALLOW_MISSING_DEPENDENCIES=true

          rm -rf out

          source build/envsetup.sh

          lunch twrp_RMX3760-eng

          mka vendorbootimage -j$(nproc)

      - name: Collect Images
        run: |
          mkdir -p workspace/output

          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760
          path: workspace/output/*.img
