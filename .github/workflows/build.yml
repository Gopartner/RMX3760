name: Build TWRP RMX3760 Android 15

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core \
            repo \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32z1-dev \
            lib32ncurses6 \
            libncurses5-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3 \
            python-is-python3 \
            rsync \
            cpio \
            lz4 \
            bc

      - name: Prepare Repo
        run: |
          mkdir -p ~/bin
          ln -sf /usr/bin/repo ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Init TWRP Source
        run: |
          mkdir workspace
          cd workspace

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --optimized-fetch \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Copy Device Tree
        run: |
          mkdir -p workspace/device/realme/RMX3760
          cp -a device_tree/. workspace/device/realme/RMX3760/
          rm -rf device_tree

      - name: Patch minuitwrp graphics
        # Fixes "Atomic commit failed ret=-22" that prevents TWRP UI from drawing
        run: |
          set -e
          cp workspace/bootable/recovery/minuitwrp/graphics_drm.cpp \
             workspace/bootable/recovery/minuitwrp/graphics_drm.cpp.orig
          cp workspace/device/realme/RMX3760/issue_atomic/graphics_drm.cpp \
             workspace/bootable/recovery/minuitwrp/graphics_drm.cpp
          echo "--- patched graphics_drm.cpp ---"
          head -5 workspace/bootable/recovery/minuitwrp/graphics_drm.cpp

      - name: Build Vendor Boot
        shell: bash
        run: |
          set -e
          set -o pipefail

          cd workspace

          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_RMX3760-eng

          echo "========== START BUILD =========="

          mka vendorbootimage -j"$(nproc)"

      - name: Collect Artifact
        shell: bash
        run: |
          set -e

          PRODUCT_DIR=$(find workspace/out/target/product -mindepth 1 -maxdepth 1 -type d | head -n1)

          test -f "$PRODUCT_DIR/vendor_boot.img"

          mkdir -p output

          cp "$PRODUCT_DIR/vendor_boot.img" output/twrp_vendor_boot.img

          ls -lh output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp_vendor_boot
          path: output/twrp_vendor_boot.img
