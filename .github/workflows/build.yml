name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TWRP by Actions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clean Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses6 \
          x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+rx ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize Repo & Sync
      run: |
        mkdir -p workspace
        cd workspace

        git config --global user.name "arriRgb31"
        git config --global user.email "febyyusuf12345@gmail.com"

        repo init --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-12.1

        repo sync -c -j$(nproc) \
          --force-sync \
          --no-clone-bundle \
          --no-tags

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: workspace/device/realme/RMX3760

    ####################################################################
    # DEBUG
    ####################################################################

    - name: Debug Boot HAL
      run: |
        cd workspace

        echo "========== bootable/recovery =========="
        grep -R "android.hardware.boot" bootable/recovery -n || true

        echo
        echo "========== hardware =========="
        grep -R "android.hardware.boot" hardware -n || true

        echo
        echo "========== system =========="
        grep -R "android.hardware.boot" system -n || true

        echo
        echo "========== Android.bp =========="
        find bootable/recovery -name Android.bp -exec sed -n '1,250p' {} \;

    ####################################################################
    # BUILD
    ####################################################################

    - name: Build TWRP
      run: |
        cd workspace

        export ALLOW_MISSING_DEPENDENCIES=true

        source build/envsetup.sh

        lunch twrp_RMX3760-eng

        mka clean

        mka vendorbootimage -j$(nproc)

        mkdir -p output_img

        cp out/target/product/RMX3760/vendor_boot.img output_img/ || true
        cp out/target/product/RMX3760/recovery.img output_img/ || true

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Realme_C53_RMX3760
        path: workspace/output_img/*.img
