name: Build OrangeFox Recovery Android 15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Clean and Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses6 \
            libncurses6 \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file \
            rsync \
            cpio

      - name: Install Repo Tool
        run: |
          sudo apt update
          sudo apt install -y repo

          mkdir -p ~/bin
          ln -sf /usr/bin/repo ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize OrangeFox Sources
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync

          cd ~/OrangeFox_sync/sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/workspace"

          cd "$GITHUB_WORKSPACE/workspace"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc --all)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Build OrangeFox Recovery Image
        run: |
          cd workspace

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_TYPE=Unofficial
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_RMX3760-eng

          mka vendorbootimage -j$(nproc)

      - name: Collect Target Artifacts
        run: |
          mkdir -p workspace/output

          cp workspace/out/target/product/RMX3760/vendor_boot.img \
            workspace/output/OrangeFox_vendor_boot_RMX3760.img || true

          cp workspace/out/target/product/RMX3760/recovery.img \
            workspace/output/ || true

          cp workspace/out/target/product/RMX3760/OrangeFox*.zip \
            workspace/output/ || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_RMX3760_Android15
          path: workspace/output/*
