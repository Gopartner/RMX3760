name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 12288
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses6 \
            libncurses6 \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file \
            rsync

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize OrangeFox Source Manifest
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"

          # Clone OrangeFox Theme Vendor
          git clone https://gitlab.com/OrangeFox/misc/theme.git vendor/recovery/orangefox

          # Init & Sync Manifest OrangeFox 12.1
          repo init --depth=1 -u https://wiki.orangefox.tech/setup/android-12.1
          repo sync -c --force-sync --no-clone-bundle --no-tags --prune -j$(nproc)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Build OrangeFox Recovery Image
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_TYPE="Unofficial"
          export LC_ALL="C"
          rm -rf out
          source build/envsetup.sh
          lunch twrp_RMX3760-eng
          mka recoveryimage -j$(nproc)

      - name: Collect Target Artifacts
        run: |
          mkdir -p workspace/output
          # Menyalin output recovery.img (untuk target partisi init_boot) dan installer zip OrangeFox
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/init_boot_recovery.img || true
          cp workspace/out/target/product/RMX3760/OrangeFox*.zip workspace/output/ || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_RMX3760_Android15
          path: workspace/output/*
