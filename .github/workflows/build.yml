name: Build TWRP RMX3760 Android 15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update -y || (sleep 15 && sudo apt-get update -y)
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32z1-dev lib32ncurses6 \
            libncurses5-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 rsync cpio lz4 bc \
            android-sdk-libsparse-utils libssl-dev pkg-config

      - name: Install repo tool
        run: |
          if ! command -v repo &>/dev/null; then
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
            sudo install -m 755 /tmp/repo /usr/local/bin/repo
          fi
          repo --version

      - name: Init TWRP Source
        run: |
          mkdir workspace
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c --force-sync --optimized-fetch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Copy Device Tree
        run: |
          mkdir -p workspace/device/realme/RMX3760
          cp -a device_tree/. workspace/device/realme/RMX3760/

      - name: Patch minuitwrp graphics
        run: cp workspace/device/realme/RMX3760/issue_atomic/graphics_drm.cpp workspace/bootable/recovery/minuitwrp/graphics_drm.cpp

      - name: Build vendor_boot
        shell: bash
        run: |
          set -e
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_RMX3760-eng
          mka vendorbootimage -j"$(nproc)"

      - name: Merge vendor_boot ramdisk 2→1 fragment (Unisoc fix)
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR=$(find workspace/out/target/product -mindepth 1 -maxdepth 1 -type d | head -n1)
          python3 device_tree/scripts/merge_fragments.py "$PRODUCT_DIR/vendor_boot.img"

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR=$(find workspace/out/target/product -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PRODUCT_DIR/vendor_boot.img"
          mkdir -p output
          cp "$PRODUCT_DIR/vendor_boot.img" output/twrp_vendor_boot.img
          ls -lh output/twrp_vendor_boot.img

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-RMX3760-vendor_boot
          path: output/twrp_vendor_boot.img
          if-no-files-found: error
