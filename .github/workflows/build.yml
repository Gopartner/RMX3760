name: Build TWRP Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            libncurses6 \
            x11proto-core-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            binutils \
            file

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init Repo
        run: |
          mkdir workspace
          cd workspace

          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/realme/RMX3760

      ####################################################################
      # SOURCE INSPECTION
      ####################################################################

      - name: Inspect Boot HAL Sources
        run: |
          cd workspace

          echo "=============================="
          echo "BOOT HAL MODULES"
          echo "=============================="

          grep -R 'name: "android.hardware.boot@1.0"' -n . || true
          grep -R 'name: "android.hardware.boot@1.1"' -n . || true
          grep -R 'name: "android.hardware.boot@1.2"' -n . || true

          echo
          echo "=============================="
          echo "BOOTCTRL"
          echo "=============================="

          grep -R "bootctrl" -n hardware device system bootable || true

          echo
          echo "=============================="
          echo "LIBCPP"
          echo "=============================="

          grep -R "libc++" hardware/interfaces -n || true

          echo
          echo "=============================="
          echo "VERBOSE_ABORT"
          echo "=============================="

          grep -R "__libcpp_verbose_abort" . || true

      ####################################################################
      # BUILD
      ####################################################################

      - name: Build Recovery
        run: |
          cd workspace

          export ALLOW_MISSING_DEPENDENCIES=true

          rm -rf out

          source build/envsetup.sh

          lunch twrp_RMX3760-eng

          mka vendorbootimage -j$(nproc)

      ####################################################################
      # ELF ANALYSIS
      ####################################################################

      - name: Analyze Built Libraries
        run: |
          cd workspace

          echo "=============================="
          echo "BOOT HAL"
          echo "=============================="

          find out -name "android.hardware.boot*.so"

          echo
          LIB=$(find out -name "android.hardware.boot@1.0.so" | head -1)

          echo "$LIB"

          if [ -f "$LIB" ]; then

            echo
            echo "=============================="
            echo "FILE"
            echo "=============================="

            file "$LIB"

            echo
            echo "=============================="
            echo "NEEDED"
            echo "=============================="

            readelf -d "$LIB"

            echo
            echo "=============================="
            echo "UNDEFINED"
            echo "=============================="

            nm -D "$LIB" | grep " U "

            echo
            echo "=============================="
            echo "VERBOSE"
            echo "=============================="

            nm -D "$LIB" | grep verbose || true

          fi

      ####################################################################
      # OUTPUT
      ####################################################################

      - name: Collect Images
        run: |
          mkdir -p workspace/output

          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/ || true
          cp workspace/out/target/product/RMX3760/recovery.img workspace/output/ || true

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_RMX3760
          path: workspace/output/*.img

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: BootHAL_ELF
          path: |
            workspace/out/**/*.so
