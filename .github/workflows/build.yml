name: Build OrangeFox Recovery Android 15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Clean and Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 lib32ncurses6 libncurses6 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 binutils file rsync cpio

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          # Menggunakan paket repo bawaan resmi dari repositori Ubuntu
          sudo apt-get update && sudo apt-get install -y repo
          # Buat symlink agar folder workspace bisa memanggilnya secara global
          ln -sf /usr/bin/repo ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Repo & Sync
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "arriRgb31"
          git config --global user.email "febyyusuf12345@gmail.com"

          # Optimasi Git Buffer untuk mengantisipasi data berukuran besar
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestSize 100M

          # SOLUSI UTAMA: Mengalihkan dari GitLab ke Mirror Resmi di GitHub guna menghindari Error 403
          repo init --depth=1 -u https://github.com -b fox_14.1

          # Proses sinkronisasi dengan parameter aman agar tidak terputus di tengah jalan
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch || repo sync -c -j1 --force-sync

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          # Memasukkan Device Tree hasil perbaikan lokal langsung ke jalur kompilasi
          path: workspace/device/realme/RMX3760

      - name: Set Python Default
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Build OrangeFox Recovery Image
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_TYPE="Unofficial"
          export LC_ALL="C"
          
          # Inisialisasi environment kompilasi TWRP/OrangeFox
          source build/envsetup.sh
          lunch twrp_RMX3760-eng
          
          # Kompilasi ke target vendor_bootimage sesuai arsitektur Android 15 Realme C53
          mka vendor_bootimage -j$(nproc)

      - name: Collect Target Artifacts
        run: |
          mkdir -p workspace/output
          cp workspace/out/target/product/RMX3760/vendor_boot.img workspace/output/OrangeFox_vendor_boot_RMX3760.img || true
          cp workspace/out/target/product/RMX3760/OrangeFox*.zip workspace/output/ || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_RMX3760_Android15
          path: workspace/output/*

